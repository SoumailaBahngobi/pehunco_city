# .gitlab-ci.yml - VERSION CORRIGÉE
image: node:18-alpine

pages:
  stage: deploy
  script:
    - npm install
    - npm run build
    - rm -rf public
    - mkdir public
    - cp -r build/* public/
    # CRITIQUE: Copie index.html pour les routes
    - cp public/index.html public/404.html
  artifacts:
    paths:
      - public
  only:
    - main