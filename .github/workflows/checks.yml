name: Vérifications

on: [pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build check
      run: npm run build
    
    - name: Test check
      run: npm test -- --watchAll=false || echo "Tests optionnels"
    
    - name: PR Size Check
      uses: nano-byte/github-action-pr-size@v1
      with:
        maxAdditions: 1000
        maxDeletions: 1000
        failIfExceeded: true